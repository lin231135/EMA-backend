name: Backend CI/CD

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write   # publicar en GHCR

concurrency:
  group: backend-deploy
  cancel-in-progress: true

jobs:
  # Validación en PR: solo compila la imagen (no publica)
  build_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t test-build-ema-backend:pr-$GITHUB_RUN_NUMBER .

  # Build & Deploy cuando haces push a main
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Login a GHCR con el token del repo
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construye y publica :<sha7> y :latest
      - name: Build & Push image
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE="ghcr.io/${{ github.repository_owner }}/ema-backend:${SHORT_SHA}"
          IMAGE_LATEST="ghcr.io/${{ github.repository_owner }}/ema-backend:latest"
          docker build -t "$IMAGE" -t "$IMAGE_LATEST" .
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_ENV

      # Despliegue por SSH (solo si configuraste secrets)
      - name: Deploy via SSH with docker-compose
        if: ${{ secrets.SSH_HOST && secrets.SSH_USER && secrets.SSH_KEY && secrets.DEPLOY_DIR }}
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            # Si la imagen es privada en GHCR, haz login en el servidor
            if [ -n "${{ secrets.GHCR_USERNAME }}" ] && [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            fi

            cd ${{ secrets.DEPLOY_DIR }}
            echo "Usando imagen: ${IMAGE_LATEST}"
            # Asegúrate que docker-compose.prod.yml apunta a :latest
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker system prune -af